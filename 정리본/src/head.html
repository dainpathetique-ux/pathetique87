<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>경화여고 2-2 중간 영어 통합 정리본</title>
<style>
@font-face{font-family:"NSK";src:url("fonts/NotoSansKR-Regular.otf");font-weight:400;}
@font-face{font-family:"NSK";src:url("fonts/NotoSansKR-Medium.otf");font-weight:500;}
@font-face{font-family:"NSK";src:url("fonts/NotoSansKR-Bold.otf");font-weight:700;}
@page{size:A4;margin:8.5mm 8.5mm 10.5mm 8.5mm;}
:root{--ac:#7a2e5b;--ac2:#a8588a;--tint:#f8eff4;--tint2:#f2f2f2;--line:#c9c9c9;--ink:#1a1a1a;--mute:#555;}
*{box-sizing:border-box;}
body{font-family:"NSK",sans-serif;font-size:8.5pt;line-height:1.31;margin:0;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere;}
.cols{column-count:2;column-gap:5mm;column-rule:0.4pt solid var(--line);}
h1{font-size:15.5pt;margin:0 0 2pt;color:var(--ac);letter-spacing:-0.3pt;}
.scope{font-size:8pt;color:var(--mute);border-bottom:1.5pt solid var(--ac);padding-bottom:3pt;margin-bottom:6pt;line-height:1.4;}
h2{font-size:10.8pt;background:var(--ac);color:#fff;padding:2.5pt 6pt;margin:7pt 0 4pt;border-radius:2pt;break-after:avoid;line-height:1.3;}
h2 .sub{font-weight:400;font-size:7.8pt;margin-left:4pt;opacity:.92;}
h3{font-size:9.6pt;color:var(--ac);border-bottom:1pt solid var(--ac2);margin:6pt 0 3pt;padding-bottom:1pt;break-after:avoid;}
p{margin:0 0 3pt;}
ul{margin:0 0 3pt 11pt;padding:0;}
li{margin:0 0 1.5pt;}
table{border-collapse:collapse;width:100%;font-size:7.9pt;margin:2pt 0 4pt;line-height:1.3;}
th,td{border:0.5pt solid var(--line);padding:2pt 3.5pt;vertical-align:top;text-align:left;}
th{background:var(--tint);color:var(--ac);font-weight:700;}
tr:nth-child(even) td{background:#fafafa;}
/* 지문 단위 */
.para{margin:0 0 5pt;padding-bottom:3pt;border-bottom:0.4pt dotted var(--line);}
.pt{font-weight:700;font-size:9.3pt;color:var(--ac);border-left:3pt solid var(--ac);padding:1pt 0 1pt 5pt;margin:4pt 0 2pt;break-after:avoid;line-height:1.3;}
.tag{display:inline-block;background:var(--ac);color:#fff;font-size:7.6pt;padding:0 4pt;margin-right:3pt;border-radius:2pt;font-weight:700;vertical-align:1pt;}
.typ{font-weight:400;font-size:7.8pt;color:var(--mute);}
.gist,.sum{padding-left:25pt;text-indent:-25pt;margin:0 0 2pt;}
.gist::before,.sum::before,.lb{display:inline-block;width:23pt;text-indent:0;text-align:center;font-weight:700;font-size:7.5pt;line-height:1.5;border-radius:2pt;margin-right:4pt;vertical-align:1pt;}
.gist::before{content:"요지";background:var(--ac);color:#fff;}
.sum::before{content:"요약";background:var(--tint);color:var(--ac);border:0.5pt solid var(--ac2);}
.sum{color:#333;}
.mc{margin:1pt 0 2pt;font-size:8.2pt;line-height:1.31;}
.mcl{padding-left:25pt;text-indent:-25pt;margin:0 0 1pt;}
.lb{background:var(--tint2);color:#333;border:0.5pt solid #ddd;width:auto;min-width:23pt;white-space:nowrap;padding:0 2pt;}
.sep{display:none;}
.x{color:var(--ac);font-weight:700;}
.st{color:var(--ac);}
.wr{border:0.6pt solid var(--ac2);border-left:3pt solid var(--ac);border-radius:2pt;padding:3pt 5pt 3pt 6pt;margin:3pt 0 0;background:var(--tint);break-inside:avoid;font-size:8.3pt;}
.wl{font-weight:700;color:var(--ac);}
.kind{font-size:7.8pt;color:var(--mute);}
.bogi{display:block;margin-top:1pt;}
.ans{display:block;color:var(--mute);font-size:7.7pt;margin-top:1pt;border-top:0.4pt dotted var(--ac2);padding-top:1pt;}
.box{border:0.6pt solid var(--line);border-radius:3pt;padding:4pt 6pt;margin:3pt 0 6pt;break-inside:avoid;background:#fcfcfc;}
.box .t{font-weight:700;color:var(--ac);border-bottom:0.6pt solid var(--ac2);margin-bottom:3pt;padding-bottom:1pt;}
.small{font-size:7.9pt;color:#333;}
.k{font-weight:700;}
.voc td{font-size:7.7pt;padding:1pt 2.5pt;}
.nb{break-inside:avoid;}
.pb{break-before:column;}
.pg{break-before:page;}
.cols.pg{break-before:page;}
u{text-decoration:none;border-bottom:1pt solid var(--ac);padding:0 2pt;color:var(--ac);font-weight:700;}
</style></head><body>
