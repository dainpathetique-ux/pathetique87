<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:"NKR";src:url(../../tool/kr400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"NKR";src:url(../../tool/kr700.woff2) format("woff2");font-weight:700}
body{margin:0;font-family:"NKR",sans-serif}
.frame{width:1080px;height:1920px;position:relative;overflow:hidden}
.sub{position:absolute;left:0;right:0;display:flex;justify-content:center}
.box{background:rgba(20,24,34,.62);color:#fff;border-radius:28px;padding:34px 48px;text-align:center;
  box-shadow:0 8px 40px rgba(0,0,0,.25);max-width:900px}
.t1{font-size:62px;font-weight:700;line-height:1.3;letter-spacing:-1px}
.t2{font-size:40px;font-weight:400;margin-top:18px;opacity:.9}
.t3{font-size:56px;font-weight:700;line-height:1.35;letter-spacing:-1px;word-break:keep-all}
.t3 em{font-style:normal;color:#ffd166}
.outro{background:#fff}
.outro img{position:absolute;left:10%;width:80%;top:calc(50% - 300px)}
.outro .msg{position:absolute;left:0;right:0;top:calc(50% + 180px);text-align:center;font-size:44px;color:#333;font-weight:400;letter-spacing:-0.5px}
</style></head><body>
<div class="frame" id="sub1"><div class="sub" style="top:1300px"><div class="box">
  <div class="t1">「비 오는 날이면<br>가리봉동에 가야 한다」</div><div class="t2">양귀자</div></div></div></div>
<div class="frame" id="sub2"><div class="sub" style="top:1340px"><div class="box">
  <div class="t3">시점은 이름표 말고<br><em>'누구의 눈'</em>으로 풀기</div></div></div></div>
<div class="frame outro" id="outro"><img src="../../tool/logo.jpg"><div class="msg">자세한 내용은 블로그에서 확인하세요</div></div>
</body></html>
